# ── 리버스 프록시 ──
# 외부에는 80 포트만 열고, api 컨테이너는 네트워크 내부에만 둔다.
upstream risk_api {
    # compose 서비스명. --scale api=3 으로 늘리면 DNS 가 여러 IP 를 돌려주고
    # nginx 가 라운드로빈으로 분산한다.
    server api:8000;
    keepalive 32;
}

# 정적 파일 캐시 정책
map $sent_http_content_type $static_cache {
    default                    "no-cache";
    "text/css"                 "public, max-age=86400";
    "application/javascript"   "public, max-age=86400";
    "~image/"                  "public, max-age=604800";
}

# API 요청 제한 (앱 레벨 제한과 이중 방어)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # 응답 압축
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;

    # 업로드 크기 제한
    client_max_body_size 1m;

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # nginx 자체 헬스체크 (백엔드를 거치지 않음)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /static/ {
        proxy_pass http://risk_api;
        add_header Cache-Control $static_cache;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://risk_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 앱이 실제 클라이언트 IP 를 알아야 요청 제한을 걸 수 있다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://risk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
}
