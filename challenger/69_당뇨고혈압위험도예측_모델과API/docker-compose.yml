# ── 챌린저 69: 당뇨·고혈압 위험도 예측 서비스 ──
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: health-risk:1.0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
