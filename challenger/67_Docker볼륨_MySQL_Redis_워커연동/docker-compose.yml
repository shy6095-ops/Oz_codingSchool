# ── 챌린저 67: FastAPI + MySQL + Redis + worker 4개 컨테이너 ──
services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # 컨테이너 네트워크에서는 서비스명으로 접속한다. 포트는 항상 컨테이너 내부 3306.
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      SLOT_CAPACITY: ${SLOT_CAPACITY}
      LOCK_STRATEGY: ${LOCK_STRATEGY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # condition 없이 depends_on 만 쓰면 "프로세스 시작"만 기다린다.
      # MySQL 은 초기화에 수십 초가 걸려서 service_healthy 로 실제 수용 상태를 기다려야 한다.
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # docker compose up -d --scale worker=3 으로 수평 확장 가능
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_HOST}:3306"
    volumes:
      # 이름 있는 볼륨. 컨테이너를 지워도(down) 데이터가 남는다.
      # down -v 를 해야 볼륨까지 삭제된다.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    # appendonly: 디스크에 명령을 기록해 재시작 후에도 데이터를 복구한다.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:
