# ── 챌린저 68: 모델 서빙 (api + worker + redis) ──
# api 와 worker 는 같은 이미지를 공유하고 실행 명령만 다르게 준다.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: challenger68-serving:1.0
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: "300"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # 같은 이미지를 재사용한다. 빌드가 한 번만 돌고 버전이 어긋날 일이 없다.
    image: challenger68-serving:1.0
    command: ["python", "-m", "worker.main"]
    environment:
      REDIS_URL: redis://redis:6379/0
      RESULT_TTL: "600"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
