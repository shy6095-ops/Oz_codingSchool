<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>당뇨 · 고혈압 위험도 예측</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
    <span class="brand">헬스 리스크 체크</span>
    <span class="version" id="modelVersion">모델 로딩 중…</span>
</header>

<main class="wrap">
    <section class="intro">
        <span class="badge">Diabetes × Hypertension</span>
        <h1>건강 지표로 <span>당뇨 · 고혈압 위험도</span>를 확인하세요</h1>
        <p>최근 건강검진 결과를 입력하면 두 질환의 위험도와 개선 권고를 함께 알려드립니다.</p>
    </section>

    <div class="layout">
        <form id="riskForm" class="card form">
            <h2>건강 지표 입력</h2>

            <div class="grid2">
                <label>나이
                    <input type="number" name="age" min="19" max="100" value="52" required>
                </label>
                <label>주간 운동일수
                    <input type="number" name="exercise_days" min="0" max="7" value="1" required>
                </label>
                <label>키 (cm)
                    <input type="number" name="height_cm" step="0.1" min="120" max="220" value="176" required>
                </label>
                <label>체중 (kg)
                    <input type="number" name="weight_kg" step="0.1" min="30" max="200" value="82" required>
                </label>
                <label>수축기 혈압 (mmHg)
                    <input type="number" name="systolic" step="0.1" min="70" max="250" value="138" required>
                </label>
                <label>이완기 혈압 (mmHg)
                    <input type="number" name="diastolic" step="0.1" min="40" max="150" value="88" required>
                </label>
                <label>공복 혈당 (mg/dL)
                    <input type="number" name="glucose" step="0.1" min="40" max="500" value="112" required>
                </label>
                <label>HbA1c (%)
                    <input type="number" name="hba1c" step="0.1" min="3" max="15" value="6.1" required>
                </label>
            </div>

            <div class="checks">
                <label class="check"><input type="checkbox" name="family_history" checked> 직계가족 당뇨·고혈압 병력</label>
                <label class="check"><input type="checkbox" name="smoker"> 현재 흡연</label>
            </div>

            <p class="bmi-line">계산된 BMI <strong id="bmiPreview">–</strong></p>

            <div class="actions">
                <button type="submit" class="btn primary">위험도 계산</button>
                <button type="reset" class="btn ghost">초기화</button>
            </div>
            <p class="err" id="error" hidden></p>
        </form>

        <section class="result" id="result" hidden>
            <div class="cards2" id="riskCards"></div>

            <div class="card" id="flagBox" hidden>
                <h3>검진 기준 확인</h3>
                <ul class="flags" id="flags"></ul>
            </div>

            <div class="card">
                <h3>생활습관 권고</h3>
                <ol class="tips" id="tips"></ol>
            </div>

            <p class="disclaimer" id="disclaimer"></p>
        </section>
    </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
