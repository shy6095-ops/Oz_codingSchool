name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # Stage 3에서 의존성을 app/ai extra로 분리함.
        # 테스트는 FastAPI 앱을 대상으로 하므로 app extra를 설치한다.
        run: uv sync --extra app --group dev --frozen

      - name: Run tests
        run: uv run pytest -v
